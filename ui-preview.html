<!doctype html><html><head><meta charset='utf-8'><link rel='stylesheet' href='frontend/src/styles.css'><style>body{width:1440px;height:900px;overflow:hidden}</style></head><body>
<div class='app-shell'>
<header class='app-header'><a class='app-brand'>Lazy Jane’s</a><nav class='app-nav'><a>Operations</a><a aria-current='page'>Order Entry</a><a>Kitchen</a><a>Menu Management</a><a>Users</a></nav><div class='app-session'><span>Josh</span><button class='button' data-variant='quiet'>Log Out</button></div></header>
<main class='page service-order-page'>
<header class='page-heading service-order-heading'><div><p class='eyebrow'>Service</p><h1>Order Entry</h1></div><div class='service-order-type'><button data-selected='true'>Dine In</button><button>Takeout</button><button>Delivery</button></div></header>
<div class='service-context'><div class='service-context-block'><span class='service-context-label'>Existing tables</span><div class='service-context-options'><button class='service-context-button' data-selected='true'><strong>Table 1</strong><small>2 guests</small></button><button class='service-context-button'><strong>Table 6</strong><small>9 seats</small></button></div></div><div class='service-context-new'><span class='service-context-label'>Guests</span><label class='service-guest-count'><input value='2'></label></div></div>
<div class='service-order-layout'><section class='service-menu-browser'><div class='service-group-tabs'><button data-selected='true'>Specials</button><button>Breakfast</button><button>Lunch & Dinner</button><button>Sandwiches & Deli</button><button>Gluten Free</button><button>Kids</button><button>Sides & Sweets</button></div><div class='service-category-tabs'><button data-selected='true'>Specials</button><button>Salads</button><button>Sandwiches</button></div><div class='service-menu-search'><input placeholder='Search entire menu'></div><div class='service-item-grid'>
<script>const items=['Lemon Shrimp Salad','Marion’s Chopped Salad','South Beach Salad with Grilled Chicken','Insalata Italiano','Paulo’s Salad with Grilled Chicken','Teriyaki Chicken Salad','Focaccia Sandwich','Avocado Tuna Salad','Strawberry Spinach Salad','Coconut Chicken Ala Ritz','String Bean Salad with Grilled Chicken','Southwest Cobb Salad']; for(const [i,n] of items.entries()){document.write(`<button class="service-item-card" ${i===6?'data-in-cart="true"':''}><strong>${n}</strong><p>Fresh ingredients prepared to order with house dressing and seasonal accompaniments.</p><footer><span>$${i%3===0?'19.95':'15.95'}</span><small>Customize →</small></footer></button>`)};</script>
</div></section><aside class='service-cart'><header class='service-cart-header'><div><p class='eyebrow'>Current order</p><h2>Table 1</h2></div><span>1 item</span></header><div class='service-cart-lines'><article class='service-cart-line'><div class='service-cart-line-top'><strong>Focaccia Sandwich</strong><span>$15.95</span></div><small class='service-cart-change' data-kind='remove'>NO ONION</small><small class='service-cart-change' data-kind='extra'>EXTRA PICKLES</small><div class='service-cart-controls'><button>−</button><strong>1</strong><button>+</button><button class='service-cart-edit'>Edit</button><button class='service-cart-remove'>Remove</button></div></article></div><footer class='service-cart-footer'><div class='service-cart-total'><span>Total</span><strong>$15.95</strong></div><button class='button service-fire-button' data-variant='primary'>Fire to Kitchen</button></footer></aside></div>
</main></div></body></html>
